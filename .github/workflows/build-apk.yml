
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Fix Android SDK tools error
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      # Extract the uploaded API 36 project ZIP
      - name: Extract API 36 Project
        run: |
          ZIP_FILE="TaungThuEain_API36_Project_v1_2.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP file not found!"
            exit 1
          fi

          mkdir -p /tmp/api36

          unzip -o "$ZIP_FILE" -d /tmp/api36

          if [ ! -d "/tmp/api36/app" ]; then
            echo "ERROR: app folder not found in ZIP!"
            exit 1
          fi

          rm -rf app
          cp -a /tmp/api36/app ./app

          cp /tmp/api36/build.gradle .
          cp /tmp/api36/settings.gradle .
          cp /tmp/api36/gradle.properties .

      # Build Debug APK
      - name: Build Debug APK
        run: |
          gradle --no-daemon assembleDebug

      # Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TaungThuEain-API36-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
