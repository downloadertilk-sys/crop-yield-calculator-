
name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        run: |
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK 36
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools"

      - name: Extract API 36 Project
        run: |
          ZIP_FILE="CropYield_v1_4_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found!"
            exit 1
          fi

          mkdir -p /tmp/api36
          unzip -o "$ZIP_FILE" -d /tmp/api36

          if [ ! -d "/tmp/api36/app" ]; then
            echo "ERROR: app folder not found!"
            exit 1
          fi

          rm -rf app
          cp -a /tmp/api36/app ./app

          cp /tmp/api36/build.gradle .
          cp /tmp/api36/settings.gradle .
          cp /tmp/api36/gradle.properties .

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare Signing Key
        if: env.HAS_SIGNING == 'true'
        env:
          KEY_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEY_BASE64" | base64 --decode > app/release-key.jks
          test -s app/release-key.jks
          chmod 600 app/release-key.jks

      - name: Build Signed Release APK and AAB
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/app/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: TaungThuEain-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Signed Release APK and AAB
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: TaungThuEain-Signed-Release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove Signing Key
        if: always()
        run: rm -f app/release-key.jks
