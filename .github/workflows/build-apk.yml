name: Build Signed Release APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [ ! -d "$SDK_ROOT" ]; then
            echo "ERROR: Android SDK not found!"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" \
            -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found!"
            exit 1
          fi

          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

          echo "Android SDK configured successfully."

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK 36
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Extract v1.4 Project ZIP
        shell: bash
        run: |
          ZIP_FILE="CropYield_v1.4_Project.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: Project ZIP not found: $ZIP_FILE"
            echo "Files in repository:"
            ls -la
            exit 1
          fi

          EXTRACT_DIR="$RUNNER_TEMP/crop-yield-project"
          mkdir -p "$EXTRACT_DIR"
          unzip -o "$ZIP_FILE" -d "$EXTRACT_DIR"

          # Find the actual Android project root. The ZIP may contain the
          # project files at its root or inside a single enclosing folder.
          PROJECT_DIR=""
          while IFS= read -r candidate; do
            if [ -d "$candidate/app" ] && \
               [ -f "$candidate/build.gradle" ] && \
               [ -f "$candidate/settings.gradle" ]; then
              PROJECT_DIR="$candidate"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f -name settings.gradle -printf '%h\n' | sort)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Could not locate Android project root in ZIP."
            echo "Extracted ZIP contents:"
            find "$EXTRACT_DIR" -maxdepth 5 -print
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          cp -a "$PROJECT_DIR/." "$GITHUB_WORKSPACE/"

          echo "Project extracted successfully."

      - name: Verify Android Project
        run: |
          test -d app
          test -f build.gradle
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/assets/index.html

          echo "Project verification successful."

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Prepare Signing Key
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release-key.jks

          if [ ! -s app/release-key.jks ]; then
            echo "ERROR: Signing key is empty!"
            exit 1
          fi

      - name: Build Signed Release APK and AAB
        if: env.HAS_SIGNING == 'true'
        env:
          ANDROID_KEYSTORE_PATH: app/release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle --no-daemon assembleRelease bundleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Crop-Yield-Calculator-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Signed Release APK and AAB
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Crop-Yield-Calculator-Release-APK-and-AAB
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Remove Signing Key
        if: always()
        run: |
          rm -f app/release-key.jks
